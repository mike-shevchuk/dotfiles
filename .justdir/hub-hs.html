<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mac · Hammerspoon</title>
<style>
:root{
  --bg:#0d1117;--panel:#161b22;--panel2:#1c2129;--line:#30363d;--text:#e6edf3;--dim:#8b949e;--faint:#6e7681;
  --blue:#58a6ff;--green:#3fb950;--amber:#d29922;--red:#f85149;--orange:#db6d28;--violet:#a371f7;--teal:#39c5cf;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 72px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:20px;margin:0;font-weight:650;letter-spacing:-.01em}
h2{font-size:13px;margin:0 0 10px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--dim);font-size:12px}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.pill.warn .dot{background:var(--amber)} .pill.critical .dot{background:var(--red);box-shadow:0 0 8px var(--red)}
.spacer{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.grid{display:grid;gap:12px}
.stats{grid-template-columns:repeat(4,minmax(0,1fr))}
.main{grid-template-columns:minmax(0,2fr) minmax(0,1fr);margin-top:12px}
@media (max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.main{grid-template-columns:1fr}}
.stat{display:flex;gap:12px;align-items:center}
.ring{width:64px;height:64px;flex:none}
.ring circle{fill:none;stroke-width:7}
.ring .bgc{stroke:var(--panel2)}
.ring .fg{stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .6s ease,stroke .3s}
.stat .v{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}
.stat .l{color:var(--dim);font-size:12px}
.stat .s{color:var(--faint);font-size:12px}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--panel2);margin:10px 0 6px}
.bar span{display:block;height:100%;transition:width .6s ease}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--dim);font-size:12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.spark{width:100%;height:56px;display:block;margin-top:8px}
/* treemap */
.tmhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.crumb{color:var(--blue);cursor:pointer;font-weight:600}
.crumb.cur{color:var(--text);cursor:default}
#tm{position:relative;height:440px;border-radius:8px;overflow:hidden;background:var(--panel2)}
.tile{position:absolute;border:1px solid var(--bg);border-radius:4px;padding:6px 7px;overflow:hidden;cursor:pointer;color:#fff;transition:filter .15s}
.tile:hover{filter:brightness(1.18)}
.tile b{display:block;font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #0008}
.tile small{display:block;font-size:11px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desc{color:var(--dim);font-size:12px;margin:-4px 0 10px;min-height:16px}
#tip{position:fixed;pointer-events:none;background:#000d;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;max-width:340px;z-index:9;display:none}
/* detail drawer */
#detail{margin-top:12px;display:none}
#detail .row{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
#detail .row span:first-child{color:var(--dim)}
/* controls */
.ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.ctl:last-child{border-bottom:0}
.ctl .t{font-weight:600}.ctl .h{color:var(--faint);font-size:12px}
.sw{position:relative;width:42px;height:24px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--dim);transition:transform .2s,background .2s}
.sw.on{background:#1f6feb55;border-color:var(--blue)}.sw.on::after{transform:translateX(18px);background:var(--blue)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;color:var(--dim);padding:4px 9px;cursor:pointer;font:inherit;font-size:12px}
.seg button.on{background:var(--blue);color:#0d1117;font-weight:650}
button.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer;font:inherit;font-size:13px}
button.btn:hover{border-color:var(--blue)}
button.btn.danger{color:var(--red)}button.btn.danger:hover{border-color:var(--red)}
button:disabled,.sw.dis{opacity:.45;cursor:not-allowed}
/* commands */
.cmds{margin-top:12px}
.cmdbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
input[type=search]{flex:1;min-width:220px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;font:inherit}
input[type=search]:focus{outline:none;border-color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--dim);cursor:pointer;user-select:none}
.chip.on{border-color:var(--blue);color:var(--blue);background:#1f6feb22}
.list{max-height:520px;overflow:auto;border-top:1px solid var(--line)}
.cmd{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid #21262d}
.cmd:hover{background:var(--panel2)}
.cmd .tt{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd .dd{color:var(--faint);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
kbd{font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--text)}
.kind{font-size:11px;border-radius:5px;padding:1px 6px;border:1px solid var(--line);color:var(--dim)}
.kind.key{color:var(--blue)}.kind.just{color:var(--green)}.kind.action{color:var(--violet)}.kind.fn{color:var(--amber)}
#toast{position:fixed;right:16px;bottom:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;box-shadow:0 6px 24px #0008;display:none;max-width:360px;z-index:10}
.ro{color:var(--amber);font-size:12px}
.muted{color:var(--faint)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔨 Mac · Hammerspoon</h1>
    <span class="pill" id="press"><span class="dot"></span><span>тиск: …</span></span>
    <span class="pill" id="upd">оновлення…</span>
    <span class="ro" id="ro" hidden>перегляд: керувати можна лише з цього Mac</span>
    <span class="spacer"></span>
    <button class="btn" id="refresh">↻ Оновити</button>
  </header>

  <section class="grid stats">
    <div class="card stat" id="st-ram"></div>
    <div class="card stat" id="st-swap"></div>
    <div class="card stat" id="st-wired"></div>
    <div class="card stat" id="st-cmp"></div>
  </section>

  <section class="card" style="margin-top:12px">
    <h2>Склад памʼяті</h2>
    <div class="bar" id="mbar"></div>
    <div class="legend" id="mleg"></div>
    <svg class="spark" id="spark" viewBox="0 0 600 56" preserveAspectRatio="none"></svg>
    <div class="legend"><span><i style="background:var(--blue)"></i>RAM %</span><span><i style="background:var(--orange)"></i>swap %</span><span class="muted" id="sparkInfo"></span></div>
  </section>

  <section class="grid main">
    <div class="card">
      <div class="tmhead"><h2 style="margin:0">Хто їсть памʼять</h2><span class="muted">·</span><span id="crumbs"></span></div>
      <div class="desc" id="tmdesc"></div>
      <div id="tm"></div>
      <div id="detail" class="card"></div>
    </div>
    <div class="card">
      <h2>Керування</h2>
      <div id="controls"></div>
    </div>
  </section>

  <section class="card cmds">
    <h2>Усі команди Hammerspoon <span class="muted" id="cmdcount"></span></h2>
    <div class="cmdbar">
      <input type="search" id="q" placeholder="Пошук: назва, клавіші, категорія…  ( / — фокус )">
      <div class="seg" id="kinds"></div>
    </div>
    <div class="chips" id="cats"></div>
    <div class="list" id="list"></div>
  </section>
</div>
<div id="tip"></div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === "class") e.className = v; else if (k.startsWith("on")) e[k] = v; else if (k === "style") e.style.cssText = v; else e.setAttribute(k, v); } for (const k of kids) if (k != null) e.append(k); return e; };
const fmt = kb => kb >= 1048576 ? (kb / 1048576).toFixed(1) + " GB" : Math.round(kb / 1024) + " MB";
const up = e => { const m = /^(?:(\d+)-)?(?:(\d+):)?(\d+):\d+$/.exec(e || ""); if (!m) return e || ""; const d = +(m[1] || 0), h = +(m[2] || 0), mi = +m[3]; return d ? `${d}д ${h}г` : h ? `${h}г ${mi}хв` : `${mi}хв`; };
let SELF = false, MEM = null, ST = null, path = [], hist = [];

function toast(msg, ok = true) { const t = $("#toast"); t.textContent = msg; t.style.borderColor = ok ? "var(--green)" : "var(--red)"; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 3500); }
async function post(url, body) {
  const r = await fetch(url, { method: "POST", body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ error: r.statusText }));
  if (!r.ok || j.error) throw new Error(j.error || r.statusText);
  return j;
}

/* ── stats ─────────────────────────────────────────────── */
function ring(pct, color) {
  const r = 26, c = 2 * Math.PI * r;
  return `<svg class="ring" viewBox="0 0 64 64"><circle class="bgc" cx="32" cy="32" r="${r}"/><circle class="fg" cx="32" cy="32" r="${r}" stroke="${color}" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - Math.min(1, pct))}"/><text x="32" y="36" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="650">${Math.round(pct * 100)}%</text></svg>`;
}
const lvl = p => p > .9 ? "var(--red)" : p > .75 ? "var(--amber)" : "var(--green)";
function stat(id, pct, label, value, sub, color) { $(id).innerHTML = ring(pct, color || lvl(pct)) + `<div><div class="l">${label}</div><div class="v">${value}</div><div class="s">${sub}</div></div>`; }
function renderSys(s) {
  const p = s.used / s.total, sp = s.swapTotal ? s.swapUsed / s.swapTotal : 0;
  stat("#st-ram", p, "RAM зайнято", `${fmt(s.used)} / ${fmt(s.total)}`, `вільно ${fmt(s.free)} · неактивна ${fmt(s.inactive)}`);
  stat("#st-swap", sp, "Swap (на диску)", `${fmt(s.swapUsed)} / ${fmt(s.swapTotal)}`, "росте, коли RAM бракує", sp > .8 ? "var(--red)" : "var(--orange)");
  stat("#st-wired", s.wired / s.total, "Wired (ядро, драйвери)", fmt(s.wired), "не стискається; росте з аптаймом → reboot", "var(--violet)");
  stat("#st-cmp", s.compressed / s.total, "Стиснута", fmt(s.compressed), "macOS стискає, щоб не лізти в swap", "var(--teal)");
  const pr = $("#press"); pr.className = "pill " + s.pressure; pr.lastElementChild.textContent = "тиск: " + ({ normal: "норма", warn: "високий", critical: "КРИТИЧНИЙ" }[s.pressure] || s.pressure);
  const parts = [["Wired", s.wired, "var(--violet)"], ["Активна", s.active, "var(--blue)"], ["Стиснута", s.compressed, "var(--teal)"], ["Неактивна", s.inactive, "var(--faint)"], ["Вільна", s.free, "var(--green)"]];
  $("#mbar").replaceChildren(...parts.map(([n, v, c]) => el("span", { style: `width:${v / s.total * 100}%;background:${c}`, title: `${n}: ${fmt(v)}` })));
  $("#mleg").replaceChildren(...parts.map(([n, v, c]) => el("span", {}, el("i", { style: `background:${c}` }), `${n} ${fmt(v)}`)));
  hist.push({ t: Date.now(), r: p, s: sp }); hist = hist.slice(-120);
  const W = 600, H = 56, line = k => hist.map((h, i) => `${i ? "L" : "M"}${(i / Math.max(1, hist.length - 1) * W).toFixed(1)},${(H - 4 - h[k] * (H - 8)).toFixed(1)}`).join("");
  $("#spark").innerHTML = `<path d="${line("r")}" fill="none" stroke="#58a6ff" stroke-width="2" vector-effect="non-scaling-stroke"/><path d="${line("s")}" fill="none" stroke="#db6d28" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
  $("#sparkInfo").textContent = `останні ${Math.round((hist.at(-1).t - hist[0].t) / 60000)} хв, поки сторінка відкрита`;
}

/* ── treemap (squarified) ──────────────────────────────── */
const HUE = n => /^Claude/.test(n) ? 22 : /Thorium|Brave|Chrome|Safari|Edge/.test(n) ? 212 : n === "Python" ? 140 : /^shell/.test(n) ? 220 : n === "just" ? 270 : /WindowServer|kernel|Dock|Finder|Spotlight|Notification|VTDecoder|mds/.test(n) ? 185 : 250;
function squarify(items, x, y, w, h) {
  const out = [], total = items.reduce((a, b) => a + b.v, 0); if (!total) return out;
  const scale = w * h / total; let rest = items.map(i => ({ ...i, a: i.v * scale }));
  while (rest.length) {
    const short = Math.min(w, h); let row = [], best = Infinity;
    for (const it of rest) {
      const r = [...row, it], s = r.reduce((a, b) => a + b.a, 0), mx = Math.max(...r.map(z => z.a)), mn = Math.min(...r.map(z => z.a));
      const worst = Math.max(short * short * mx / (s * s), s * s / (short * short * mn));
      if (worst > best) break; best = worst; row = r;
    }
    const s = row.reduce((a, b) => a + b.a, 0), thick = s / short; let off = 0;
    for (const it of row) { const len = it.a / thick; out.push(w >= h ? { ...it, x, y: y + off, w: thick, h: len } : { ...it, x: x + off, y, w: len, h: thick }); off += len; }
    if (w >= h) { x += thick; w -= thick; } else { y += thick; h -= thick; }
    rest = rest.slice(row.length);
  }
  return out;
}
function renderTree() {
  if (!MEM) return;
  const box = $("#tm"), W = box.clientWidth, H = box.clientHeight;
  let nodes, desc = "", hue;
  if (!path.length) {
    nodes = MEM.groups.filter(g => g.kb > 20 * 1024).map(g => ({ v: g.kb, name: g.name, sub: `${fmt(g.kb)} · ×${g.n} · CPU ${g.cpu.toFixed(0)}%`, g }));
    desc = "Клікни групу — побачиш кожен процес. Розмір плитки = реальна памʼять (з урахуванням стиснутої і swap).";
  } else {
    const g = path[0]; hue = HUE(g.name); desc = g.desc || "";
    nodes = g.items.filter(i => i.kb > 1024).map(i => ({ v: i.kb, name: i.label, sub: `${fmt(i.kb)} · CPU ${i.cpu.toFixed(1)}% · ${up(i.etime)}`, it: i }));
  }
  $("#tmdesc").textContent = desc;
  $("#crumbs").replaceChildren(el("span", { class: "crumb" + (path.length ? "" : " cur"), onclick: () => { path = []; $("#detail").style.display = "none"; renderTree(); } }, "усе"),
    ...(path.length ? [" › ", el("span", { class: "crumb cur" }, path[0].name)] : []));
  nodes.sort((a, b) => b.v - a.v);
  const max = nodes[0]?.v || 1;
  box.replaceChildren(...squarify(nodes, 0, 0, W, H).map(n => {
    const hh = hue ?? HUE(n.name), light = 26 + 16 * Math.sqrt(n.v / max);
    const t = el("div", { class: "tile", style: `left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px;background:hsl(${hh} 55% ${light}%)` });
    if (n.w > 46 && n.h > 22) t.append(el("b", {}, n.name)); if (n.w > 70 && n.h > 38) t.append(el("small", {}, n.sub));
    t.onmousemove = e => { const tp = $("#tip"); tp.style.display = "block"; tp.style.left = Math.min(e.clientX + 14, innerWidth - 350) + "px"; tp.style.top = e.clientY + 14 + "px"; tp.replaceChildren(el("b", {}, n.name), el("div", { class: "muted" }, n.sub), ...(n.g?.desc ? [el("div", {}, n.g.desc)] : [])); };
    t.onmouseleave = () => $("#tip").style.display = "none";
    t.onclick = () => { $("#tip").style.display = "none"; if (n.g) { path = [n.g]; renderTree(); } else showDetail(n.it); };
    return t;
  }));
}
function showDetail(it) {
  const d = $("#detail"); d.style.display = "block";
  const kids = (it.kids || []).map(k => el("div", { class: "row" }, el("span", {}, `↳ ${k.name} ×${k.n}`), el("span", {}, fmt(k.kb))));
  const kill = el("button", { class: "btn danger", onclick: async () => {
    if (!confirm(`Завершити PID ${it.pid} (${it.label})?`)) return;
    try { const r = await post("/_hs/kill", { pid: it.pid }); toast(`Завершено ${r.comm} (${r.pid})`); setTimeout(loadMem, 1500); } catch (e) { toast(e.message, false); }
  } }, "Завершити процес (SIGTERM)");
  if (!SELF) kill.disabled = true;
  d.replaceChildren(el("h2", {}, it.label), el("div", { class: "row" }, el("span", {}, "PID"), el("span", {}, String(it.pid))),
    el("div", { class: "row" }, el("span", {}, "Памʼять (разом з дітьми)"), el("span", {}, fmt(it.kb))),
    el("div", { class: "row" }, el("span", {}, "CPU"), el("span", {}, it.cpu.toFixed(1) + "%")),
    el("div", { class: "row" }, el("span", {}, "Працює"), el("span", {}, up(it.etime))), ...kids, el("div", { style: "margin-top:10px" }, kill));
  d.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

/* ── controls ──────────────────────────────────────────── */
function renderControls() {
  if (!ST) return;
  const sw = (what, on, title, hint) => { const s = el("div", { class: "sw" + (on ? " on" : "") + (SELF ? "" : " dis"), role: "switch", "aria-checked": String(!!on), title: SELF ? "" : "лише з цього Mac" });
    s.onclick = async () => { if (!SELF) return; try { await post("/_hs/toggle", { what }); s.classList.toggle("on"); setTimeout(loadState, 600); } catch (e) { toast(e.message, false); } };
    return el("div", { class: "ctl" }, el("div", {}, el("div", { class: "t" }, title), el("div", { class: "h" }, hint)), s); };
  const seg = el("div", { class: "seg" }, ...[0.5, 1, 1.5, 2, 3].map(v => { const b = el("button", { class: Math.abs(ST.scroll - v) < .01 ? "on" : "" }, v + "×"); b.disabled = !SELF;
    b.onclick = async () => { try { await post("/_hs/toggle", { what: "scroll", value: v }); ST.scroll = v; renderControls(); } catch (e) { toast(e.message, false); } }; return b; }));
  const pomo = el("button", { class: "btn" }, ST.pomodoro === "idle" ? "▶ Старт 25 хв" : "⏸ Зупинити"); pomo.disabled = !SELF;
  pomo.onclick = async () => { try { await post("/_hs/toggle", { what: "pomodoro" }); setTimeout(loadState, 600); } catch (e) { toast(e.message, false); } };
  $("#controls").replaceChildren(
    sw("caffeine", ST.caffeine, "☕️ Caffeine", "екран не гасне"),
    sw("guard", ST.guard, "🔨 Гарячі клавіші", `${ST.hotkeys} комбінацій Hammerspoon`),
    sw("pinch", ST.pinch, "🤏 Блок pinch-zoom", "трекпад не масштабує випадково"),
    sw("dark", ST.dark, "🌙 Темна тема macOS", "перемикає системну тему"),
    el("div", { class: "ctl" }, el("div", {}, el("div", { class: "t" }, "↕ Швидкість прокрутки"), el("div", { class: "h" }, "множник трекпада/миші")), seg),
    el("div", { class: "ctl" }, el("div", {}, el("div", { class: "t" }, "🍅 Pomodoro"), el("div", { class: "h" }, ST.pomoTitle || ({ idle: "не запущено", work: "робота", break: "перерва" }[ST.pomodoro] || ST.pomodoro))), pomo));
}

/* ── commands ──────────────────────────────────────────── */
const KIND = { key: "клавіші", action: "дія", just: "just", fn: "функція" };
let kindF = "", catF = "";
function renderCmds() {
  if (!ST) return;
  const all = ST.entries.map(e => ({ ...e, k: e.kind === "key" ? "key" : e.kind === "action" ? "action" : e.kind === "just" ? "just" : "fn" }));
  $("#cmdcount").textContent = `· ${all.length}`;
  $("#kinds").replaceChildren(...[["", "усі"], ...Object.entries(KIND)].map(([k, n]) => { const b = el("button", { class: kindF === k ? "on" : "" }, n); b.onclick = () => { kindF = k; renderCmds(); }; return b; }));
  const cats = [...new Set(all.map(e => e.category).filter(Boolean))].sort();
  $("#cats").replaceChildren(...["", ...cats].map(c => { const n = all.filter(e => !c || e.category === c).length; const ch = el("span", { class: "chip" + (catF === c ? " on" : "") }, `${c || "усі категорії"} ${n}`); ch.onclick = () => { catF = catF === c ? "" : c; renderCmds(); }; return ch; }));
  const q = $("#q").value.trim().toLowerCase();
  const rows = all.filter(e => (!kindF || e.k === kindF) && (!catF || e.category === catF) && (!q || `${e.title} ${e.chord || ""} ${e.category || ""} ${e.detail || ""} ${e.source || ""}`.toLowerCase().includes(q)))
    .sort((a, b) => (b.fav ? 1 : 0) - (a.fav ? 1 : 0));
  $("#list").replaceChildren(...rows.map(e => {
    const run = el("button", { class: "btn" }, "▶"); run.title = e.params ? "потрібні аргументи — запусти з палітри" : "Запустити";
    run.disabled = !SELF || !!e.params;
    run.onclick = async () => { try { const r = await post("/_hs/run", { title: e.title, source: e.source }); toast(r.result === "ok" ? `▶ ${e.title}` : `${e.title}: ${r.result}`, r.result === "ok"); } catch (err) { toast(err.message, false); } };
    return el("div", { class: "cmd" },
      el("div", { style: "min-width:0" }, el("div", { class: "tt" }, (e.fav ? "★ " : "") + e.title), el("div", { class: "dd" }, [e.category, e.detail || e.source].filter(Boolean).join(" · "))),
      el("div", { style: "display:flex;gap:6px;align-items:center" }, e.chord ? el("kbd", {}, e.chord) : null, el("span", { class: "kind " + e.k }, KIND[e.k])), run);
  }));
}

/* ── data ──────────────────────────────────────────────── */
async function loadMem() {
  try { MEM = await (await fetch("/_hs/mem", { cache: "no-store" })).json(); renderSys(MEM.sys);
    if (path.length) path = [MEM.groups.find(g => g.name === path[0].name) || path[0]];
    renderTree(); $("#upd").textContent = "оновлено " + new Date().toLocaleTimeString("uk", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  } catch (e) { $("#upd").textContent = "памʼять: помилка"; }
}
async function loadState() {
  try { ST = await (await fetch("/_hs/state", { cache: "no-store" })).json(); if (ST.error) throw new Error(ST.error);
    SELF = !!ST.self; $("#ro").hidden = SELF; renderControls(); renderCmds();
  } catch (e) { $("#controls").textContent = "Hammerspoon не відповідає: " + e.message; }
}
$("#q").oninput = renderCmds;
$("#refresh").onclick = () => { loadMem(); loadState(); };
addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); } });
addEventListener("resize", () => { clearTimeout(renderTree.t); renderTree.t = setTimeout(renderTree, 150); });
loadMem(); loadState();
setInterval(() => { if (!document.hidden) loadMem(); }, 15000);   // topmem.py ≈ 0.4 s CPU — only while the tab is visible
setInterval(() => { if (!document.hidden) loadState(); }, 30000);
</script>
</body>
