<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<style>
/* ============================================================================
   HOUSE STYLE — evidence-backed technical analysis report (GitHub Dark).
   Shared by: duplicate-emergency, pun1548-push-latency, pun1548-coldstart-sweep.
   Do NOT redesign per report. Add report-specific rules in the EXTRA block only.
   ============================================================================ */
:root{
 --bg:#0d1117;--panel:#161b22;--panel2:#1c2230;--bd:#30363d;--tx:#c9d1d9;--mut:#8b949e;
 --acc:#58a6ff;--red:#f85149;--org:#d29922;--grn:#3fb950;--pur:#bc8cff;
 --e1:#1f6feb;--e2:#f85149;--cold:#58a6ff;--warm:#3fb950;
 --wrap-w:1180px;--wrap-px:18px;--fs:15px;   /* live-tunable from the ☰ burger */
}
:root.light{--bg:#ffffff;--panel:#f6f8fa;--panel2:#eef1f5;--bd:#d0d7de;--tx:#1f2328;--mut:#636c76;--acc:#0969da;}
:root.nord{--bg:#2e3440;--panel:#3b4252;--panel2:#434c5e;--bd:#4c566a;--tx:#e5e9f0;--mut:#a7b0c0;--acc:#88c0d0;}
:root.dracula{--bg:#282a36;--panel:#343746;--panel2:#3c3f52;--bd:#44475a;--tx:#f8f8f2;--mut:#a7abc9;--acc:#bd93f9;}
:root.solar{--bg:#002b36;--panel:#073642;--panel2:#0a4a58;--bd:#0e5563;--tx:#93a1a1;--mut:#7a8c8c;--acc:#268bd2;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:var(--fs)/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--wrap-w);margin:0 auto;padding:24px var(--wrap-px) 80px}
h1{font-size:25px;margin:.2em 0}
h2{font-size:20px;margin:1.6em 0 .5em;border-bottom:1px solid var(--bd);padding-bottom:.3em}
h3{font-size:15px;margin:1.1em 0 .4em;color:var(--acc)}
a{color:var(--acc)}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86em}
.sub{color:var(--mut);font-size:13px}
.footnote{color:var(--mut);font-size:12.5px;margin-top:6px}

/* --- bilingual visibility (mandatory) --- */
:root:not(.ua) [data-ua]{display:none}
:root.ua [data-en]{display:none}

/* --- controls: everything lives in a ☰ burger, collapsed by default --- */
.bar{position:sticky;top:0;z-index:20;display:flex;justify-content:flex-end;background:linear-gradient(var(--bg),var(--bg) 70%,transparent);padding:8px 0 6px}
.cog{position:relative}
.cog>summary{list-style:none;background:var(--panel);color:var(--tx);border:1px solid var(--bd);border-radius:7px;padding:6px 12px;cursor:pointer;font-size:15px;line-height:1;user-select:none}
.cog>summary::-webkit-details-marker{display:none}.cog>summary::marker{content:""}
.cog>summary:hover,.cog[open]>summary{border-color:var(--acc)}
.cog .panel{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:10px;min-width:210px;box-shadow:0 8px 26px rgba(0,0,0,.45);z-index:30}
:root.light .cog .panel{box-shadow:0 8px 26px rgba(140,149,159,.3)}
.cog .grp{display:flex;flex-direction:column;gap:4px}
.cog .lbl{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin:0 2px}
.cog button{background:var(--panel2);color:var(--tx);border:1px solid var(--bd);border-radius:7px;padding:6px 10px;cursor:pointer;font-size:13px;font-family:inherit;text-align:left;white-space:nowrap}
.cog button:hover{border-color:var(--acc)}
.cog button.on{border-color:var(--acc);color:var(--acc)}
.cog .row{display:flex;gap:4px;flex-wrap:wrap}
.cog .row button{flex:1;min-width:38px;text-align:center;padding:6px 8px;font-size:15px}

/* --- verdict box: the answer, before the investigation --- */
.verdict{background:var(--panel);border:1px solid var(--bd);border-left:4px solid var(--org);border-radius:10px;padding:16px 18px;margin:14px 0}
.verdict.bad{border-left-color:var(--red)}
.verdict.good{border-left-color:var(--grn)}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--bd)}
.pill.e1{background:rgba(31,111,235,.15);color:#79b8ff;border-color:rgba(31,111,235,.5)}
.pill.e2{background:rgba(248,81,73,.15);color:#ffa198;border-color:rgba(248,81,73,.5)}
.chip{font-size:11px;padding:1px 6px;border-radius:5px;font-weight:700}
.chip.c{background:rgba(88,166,255,.15);color:#9cc7ff}
.chip.w{background:rgba(63,185,80,.15);color:#7ee787}
.hl{color:var(--red);font-weight:700}.hlg{color:var(--grn);font-weight:700}
.hlb{color:var(--acc);font-weight:700}.hlo{color:var(--org);font-weight:700}
.big{font-size:34px;font-weight:800;line-height:1}

/* --- facts: side-by-side cards with key/value tables --- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:14px;margin:14px 0}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:14px 16px}
.card.e1{border-top:4px solid var(--e1)}
.card.e2{border-top:4px solid var(--e2)}
table.kv{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
table.kv td{padding:5px 6px;border-bottom:1px solid var(--bd);vertical-align:top}
table.kv td:first-child{color:var(--mut);white-space:nowrap;width:1%;padding-right:14px}

/* --- big-number comparison (cold vs warm, before vs after) --- */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
@media(max-width:620px){.cmp{grid-template-columns:1fr}}
.cmp .box{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:16px 18px;text-align:center}
.cmp .box.cold{border-top:4px solid var(--cold)}
.cmp .box.warm{border-top:4px solid var(--warm)}
.cmp .box .k{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.cmp .box .v{font-size:46px;font-weight:800;line-height:1.05;margin:.08em 0}
.cmp .box.cold .v{color:var(--cold)}
.cmp .box.warm .v{color:var(--warm)}
.cmp .box .s{color:var(--mut);font-size:12.5px}

/* --- generic + wide tables --- */
table{width:100%;border-collapse:collapse;margin:.4em 0}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--bd);vertical-align:top}
th{color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
.tl-wrap,.lam-wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:10px}
table.lam{font-size:12.5px;min-width:820px;margin:0}
table.lam td,table.lam th{white-space:nowrap}
table.lam td.name{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--pur);white-space:normal}
table.lam td.role{white-space:normal;color:var(--mut);font-size:12px;min-width:220px}
table.lam td.num{font-family:ui-monospace,monospace;text-align:right}
tr.hot td{background:rgba(248,81,73,.09)}

/* --- annotated timeline: one row per log line, coloured by actor/stream --- */
table.tl{font-size:12px;min-width:900px;margin:0}
table.tl th{position:sticky;top:0;background:var(--panel2);z-index:1}
table.tl td.t{font-family:ui-monospace,monospace;white-space:nowrap;color:var(--tx)}
table.tl td.d{font-family:ui-monospace,monospace;white-space:nowrap;color:var(--mut)}
table.tl td.svc{font-family:ui-monospace,monospace;font-size:11px;color:var(--pur);white-space:nowrap}
table.tl td.msg{font-family:ui-monospace,monospace;font-size:11px;line-height:1.5;word-break:break-word}
tr.r-sub td{background:rgba(88,166,255,.07)}
tr.r-e1 td{background:rgba(31,111,235,.09)}
tr.r-e2 td{background:rgba(248,81,73,.09)}
tr.r-res td{background:rgba(63,185,80,.08)}
tr.r-other td{opacity:.72}

/* --- ASCII causality diagram: how the bug actually flows --- */
.flow{overflow-x:auto}
.flow pre{font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.5;color:var(--tx);background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:14px;min-width:560px}

/* --- raw untrimmed evidence dump --- */
pre.raw{background:#010409;border:1px solid var(--bd);border-radius:10px;padding:14px;overflow:auto;max-height:560px;font-size:11px;line-height:1.5;color:#adbac7}
:root.light pre.raw{background:#f6f8fa;color:#1f2328}
pre.diff{background:#010409;border:1px solid var(--bd);border-radius:10px;padding:14px;overflow:auto;font-size:12px;line-height:1.55;color:#adbac7;font-family:ui-monospace,Menlo,monospace}
:root.light pre.diff{background:#f6f8fa;color:#1f2328}
pre.diff .add{color:#7ee787;background:rgba(63,185,80,.12);display:block}
pre.diff .del{color:#ffa198;background:rgba(248,81,73,.12);display:block}
pre.diff .file{color:#9cc7ff;font-weight:700;display:block;margin-top:8px}
pre.diff .file:first-child{margin-top:0}
details.hunk summary{cursor:pointer;font-size:12px;color:var(--acc);font-weight:600;user-select:none}
details.hunk summary:hover{text-decoration:underline}

/* --- horizontal bar chart (per-item magnitudes) --- */
.barrow{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12px}
.barrow .lab{width:90px;color:var(--mut);text-align:right;font-family:ui-monospace,monospace}
.barrow .track{flex:1;background:var(--panel2);border:1px solid var(--bd);border-radius:4px;height:16px;overflow:hidden}
.barrow .track > i{display:block;height:100%}
.barrow .val{width:56px;font-family:ui-monospace,monospace;color:var(--tx)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mut);margin:.5em 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}

/* --- fix options + rollout plan --- */
.optgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:12px;margin:12px 0}
.opt{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;font-size:13px}
.opt.rec{border-color:rgba(56,139,253,.55);box-shadow:0 0 0 1px rgba(56,139,253,.25)}
.opt .head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.opt .letter{width:26px;height:26px;border-radius:7px;background:var(--panel2);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font:800 14px ui-monospace,monospace}
.opt .eff{font:700 14px ui-monospace,monospace;margin:6px 0 2px;color:#9cc7ff}
.opt ul{margin:6px 0 0;padding-left:16px;font-size:12.3px}
.opt li{margin:2px 0}
.opt li.plus::marker{color:var(--grn)}
.opt li.minus::marker{color:var(--red)}
.plan{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.plan .step{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--bd);border-left:4px solid #388bfd;border-radius:10px;padding:10px 14px;font-size:13px}

/* --- collapsible + resizable sections (JS wraps each h2 body in .blk) --- */
h2.sec-h{cursor:pointer;user-select:none}
h2 .caret{display:inline-block;width:15px;color:var(--mut);font-size:12px;margin-right:3px;vertical-align:middle}
h2.collapsed{opacity:.82;border-bottom-style:dashed}
.blk{resize:vertical;overflow:auto;min-height:44px}
.blk::-webkit-resizer{background:var(--panel2)}
/* "resize any block" — standout blocks get a drag handle too */
.hero,.verdict,.callout,.flow,.tl-wrap,.lam-wrap,pre.raw,pre.diff{resize:vertical;overflow:auto}
/* --- per-block icon toolbar (JS adds .pbar to every panel; state remembered) --- */
.pchrome{position:relative}
.pbar{position:absolute;top:6px;right:6px;display:flex;gap:3px;z-index:7;opacity:.4;transition:opacity .12s}
.pchrome:hover>.pbar,.pbar:hover,.pbar:focus-within,.pmax>.pbar{opacity:1}
.pbar button{width:23px;height:23px;display:flex;align-items:center;justify-content:center;background:var(--panel2);color:var(--mut);border:1px solid var(--bd);border-radius:6px;cursor:pointer;font:12px/1 ui-monospace,monospace;padding:0}
.pbar button:hover{border-color:var(--acc);color:var(--acc)}
.pcol>*:not(.pbar):not(:first-child){display:none!important}
.pcol{min-height:0!important;height:auto!important;resize:none!important}
.pfit:not(.pcol){flex-basis:100%!important;width:100%!important;max-width:100%!important;height:720px!important}
.psized{flex:0 0 auto!important;align-self:flex-start!important}   /* once resized, stop flex-grow from overriding the size */
.pclosed{display:none!important}
.pmax{position:fixed!important;inset:20px!important;z-index:1000!important;margin:0!important;max-width:none!important;width:auto!important;height:auto!important;overflow:auto!important;box-shadow:0 24px 70px rgba(0,0,0,.6)}
#pmask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:999}
/* --- burger: sliders + block controls --- */
.cog .sld{display:flex;flex-direction:column;gap:3px}
.cog .sld label{display:flex;justify-content:space-between;color:var(--mut);font-size:11px;font-family:ui-monospace,monospace}
.cog .sld label b{color:var(--acc)}
.cog input[type=range]{width:100%;accent-color:var(--acc);cursor:pointer;margin:0}
.cog .row2{display:flex;gap:4px}
.cog .row2 button{flex:1;text-align:center}

/* report-specific rules only (below); never restyle the base above */
{{EXTRA_CSS}}
</style>
</head>
<body>
<div class="wrap">

<div class="bar">
 <details class="cog" id="cog">
  <summary>☰</summary>
  <div class="panel">
   <div class="grp">
    <div class="lbl"><span data-en>Language</span><span data-ua>Мова</span></div>
    <button id="lang">🇺🇦 Українська</button>
   </div>
   <div class="grp">
    <div class="lbl"><span data-en>Theme</span><span data-ua>Тема</span></div>
    <div class="row" id="themes">
     <button data-theme="dark" title="GitHub Dark">🌙</button>
     <button data-theme="light" title="GitHub Light">☀︎</button>
     <button data-theme="nord" title="Nord">❄️</button>
     <button data-theme="dracula" title="Dracula">🧛</button>
     <button data-theme="solar" title="Solarized">🟧</button>
    </div>
   </div>
   <div class="grp">
    <div class="lbl"><span data-en>Layout</span><span data-ua>Розкладка</span></div>
    <div class="sld"><label><span data-en>Width</span><span data-ua>Ширина</span> <b id="wwv">1180</b></label>
     <input type="range" id="ww" min="640" max="1920" step="20" value="1180"></div>
    <div class="sld"><label><span data-en>Side padding</span><span data-ua>Бічний паддінг</span> <b id="wpxv">18</b></label>
     <input type="range" id="wpx" min="0" max="80" step="2" value="18"></div>
    <div class="sld"><label><span data-en>Font size</span><span data-ua>Розмір шрифту</span> <b id="fsv">15</b></label>
     <input type="range" id="fs" min="12" max="20" step="1" value="15"></div>
   </div>
   <div class="grp">
    <div class="lbl"><span data-en>Blocks</span><span data-ua>Блоки</span></div>
    <div class="row2">
     <button id="colall"><span data-en>▸ Collapse all</span><span data-ua>▸ Згорнути все</span></button>
     <button id="expall"><span data-en>▾ Expand all</span><span data-ua>▾ Розгорнути все</span></button>
    </div>
    <button id="rstlt"><span data-en>↺ Reset layout &amp; sizes</span><span data-ua>↺ Скинути розкладку та розміри</span></button>
   </div>
   <div class="grp" id="dlgrp">
    <div class="lbl"><span data-en>Download HTML</span><span data-ua>Завантажити HTML</span></div>
    <button data-dl="both"><span data-en>⬇︎ Both languages</span><span data-ua>⬇︎ Обидві мови</span></button>
    <button data-dl="ua"><span data-en>⬇︎ Ukrainian only</span><span data-ua>⬇︎ Лише українська</span></button>
    <button data-dl="en"><span data-en>⬇︎ English only</span><span data-ua>⬇︎ Лише англійська</span></button>
   </div>
  </div>
 </details>
</div>

<h1><span data-en>{{H1_EN}}</span><span data-ua>{{H1_UA}}</span></h1>
<p class="sub">{{SUBTITLE}}</p>

{{SECTIONS}}

</div>
<script>
(function(){
 var r=document.documentElement,
     L=document.getElementById('lang'),
     C=document.getElementById('cog'),
     DL=document.getElementById('dlgrp');
 var THEMES=['dark','light','nord','dracula','solar'];   // 'dark' = bare :root

 function lang(ua){r.classList.toggle('ua',ua);if(L)L.textContent=ua?'🇬🇧 English':'🇺🇦 Українська';try{localStorage.setItem('rep:ua',ua?'1':'0')}catch(e){}}
 function theme(name){
  if(THEMES.indexOf(name)<0)name='dark';
  for(var i=0;i<THEMES.length;i++)r.classList.remove(THEMES[i]);
  if(name!=='dark')r.classList.add(name);
  var tb=r.querySelectorAll('#themes [data-theme]');
  for(var j=0;j<tb.length;j++)tb[j].classList.toggle('on',tb[j].getAttribute('data-theme')===name);
  try{localStorage.setItem('rep:theme',name)}catch(e){}
 }
 if(L)L.onclick=function(){lang(!r.classList.contains('ua'))};
 var tbtn=document.querySelectorAll('#themes [data-theme]');
 for(var k=0;k<tbtn.length;k++)(function(b){b.onclick=function(){theme(b.getAttribute('data-theme'))};})(tbtn[k]);

 var su,stx;try{su=localStorage.getItem('rep:ua');stx=localStorage.getItem('rep:theme')}catch(e){}
 if(L)lang(su==='1'); theme(stx||'nord');   // default theme: Nord

 // ---- live layout sliders: width / side-padding / font-size ----
 function slider(id,vid,prop,unit,key){
  var el=document.getElementById(id),out=document.getElementById(vid); if(!el)return;
  var sv; try{sv=localStorage.getItem(key)}catch(e){}
  if(sv!==null&&sv!==undefined&&sv!=='')el.value=sv;
  function apply(){r.style.setProperty(prop,el.value+unit); if(out)out.textContent=el.value;}
  apply();
  el.addEventListener('input',function(){apply();try{localStorage.setItem(key,el.value)}catch(e){}});
 }
 slider('ww','wwv','--wrap-w','px','rep:ww');
 slider('wpx','wpxv','--wrap-px','px','rep:wpx');
 slider('fs','fsv','--fs','px','rep:fs');

 // ---- collapsible + resizable sections (wrap each h2 body in .blk) ----
 var SECS=[];
 (function(){
  var wrap=document.querySelector('.wrap'); if(!wrap)return;
  [].slice.call(wrap.children).forEach(function(h){
   if(h.tagName!=='H2'||h.classList.contains('sec-h'))return;   // guard: never re-wrap (e.g. an exported file)
   var id=h.id||('sec'+SECS.length);
   var car=document.createElement('span');car.className='caret';car.textContent='▾';
   h.insertBefore(car,h.firstChild);h.classList.add('sec-h');
   var body=document.createElement('div');body.className='blk';
   var n=h.nextSibling;
   while(n&&!(n.nodeType===1&&n.tagName==='H2')){var nx=n.nextSibling;body.appendChild(n);n=nx;}
   h.parentNode.insertBefore(body,h.nextSibling);
   var sh; try{sh=localStorage.getItem('rep:h:'+id)}catch(e){}
   if(sh)body.style.height=sh;
   function set(c){body.hidden=c;h.classList.toggle('collapsed',c);car.textContent=c?'▸':'▾';try{localStorage.setItem('rep:col:'+id,c?'1':'0')}catch(e){}}
   var sc; try{sc=localStorage.getItem('rep:col:'+id)}catch(e){}
   set(sc==='1');
   h.addEventListener('click',function(e){if(e.target.closest('a'))return;set(!body.hidden);});
   if(window.ResizeObserver){var ro=new ResizeObserver(function(){if(!body.hidden&&body.style.height){try{localStorage.setItem('rep:h:'+id,body.style.height)}catch(e){}}});ro.observe(body);}
   SECS.push({set:set,body:body});
  });
 })();
 var ca=document.getElementById('colall'),ea=document.getElementById('expall'),rl=document.getElementById('rstlt');
 if(ca)ca.onclick=function(){SECS.forEach(function(s){s.set(true)});};
 if(ea)ea.onclick=function(){SECS.forEach(function(s){s.set(false)});};
 if(rl)rl.onclick=function(){
  SECS.forEach(function(s){s.body.style.height='';s.set(false);});
  ['--wrap-w','--wrap-px','--fs'].forEach(function(p){r.style.removeProperty(p)});
  var d=[['ww','wwv','1180'],['wpx','wpxv','18'],['fs','fsv','15']];
  d.forEach(function(x){var el=document.getElementById(x[0]);if(el){el.value=x[2];var o=document.getElementById(x[1]);if(o)o.textContent=x[2];}});
  try{var ks=[],i,k;for(i=0;i<localStorage.length;i++){k=localStorage.key(i);if(k&&(k.indexOf('rep:h:')===0||k.indexOf('rep:col:')===0||k==='rep:ww'||k==='rep:wpx'||k==='rep:fs'))ks.push(k);}ks.forEach(function(k){localStorage.removeItem(k)});}catch(e){}
 };

 // ---- per-block icon toolbar: ⤢ full · ▾ collapse · ✕ close · ↺ reset (remembered) ----
 (function(){
  var SEL='.ecard,.hero,.verdict,.callout', mask=null;
  function unmax(el){el.classList.remove('pmax');if(mask){mask.remove();mask=null;}}
  function domax(el){document.querySelectorAll('.pmax').forEach(unmax);el.classList.add('pmax');mask=document.createElement('div');mask.id='pmask';document.body.appendChild(mask);mask.onclick=function(){unmax(el);};}
  document.querySelectorAll(SEL).forEach(function(el,i){
   if(el.querySelector(':scope>.pbar'))return;                 // guard: already chromed (export)
   var pk=el.getAttribute('data-pk')||(el.className.split(' ')[0]+'-'+i);
   el.setAttribute('data-pk',pk); el.classList.add('pchrome');
   var st={}; try{st=JSON.parse(localStorage.getItem('rep:pk:'+pk)||'{}')}catch(e){}
   function save(){try{localStorage.setItem('rep:pk:'+pk,JSON.stringify(st))}catch(e){}}
   var bar=document.createElement('div'); bar.className='pbar';
   var cb,fb;
   function mk(t,ti,fn){var b=document.createElement('button');b.type='button';b.textContent=t;b.title=ti;b.onclick=function(e){e.stopPropagation();fn();};bar.appendChild(b);return b;}
   function setCol(c){el.classList.toggle('pcol',c);if(cb)cb.textContent=c?'▸':'▾';st.c=c?1:0;save();}
   fb=mk('＋','Fit — enlarge in place (not fullscreen)',function(){var on=!el.classList.contains('pfit');el.classList.toggle('pfit',on);fb.textContent=on?'－':'＋';st.f=on?1:0;save();});
   mk('⤢','Full width / maximize (overlay)',function(){el.classList.contains('pmax')?unmax(el):domax(el);});
   cb=mk('▾','Collapse',function(){setCol(!el.classList.contains('pcol'));});
   mk('✕','Close (hide)',function(){el.classList.add('pclosed');st.x=1;save();});
   mk('↺','Reset this block',function(){el.classList.remove('pcol','pclosed','pmax','pfit','psized');unmax(el);el.style.width='';el.style.height='';st={};save();if(cb)cb.textContent='▾';if(fb)fb.textContent='＋';});
   el.appendChild(bar);
   if(st.w)el.style.width=st.w; if(st.h)el.style.height=st.h;
   if(st.w||st.h)el.classList.add('psized');
   if(st.f){el.classList.add('pfit');if(fb)fb.textContent='－';}
   if(st.c)setCol(true); if(st.x)el.classList.add('pclosed');
   if(window.ResizeObserver){var ro=new ResizeObserver(function(){if(el.classList.contains('pmax')||el.classList.contains('pcol')||el.classList.contains('pfit'))return;var w=el.style.width,h=el.style.height;if(w||h)el.classList.add('psized');if(w)st.w=w;if(h)st.h=h;if(w||h)save();});ro.observe(el);}
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape')document.querySelectorAll('.pmax').forEach(unmax);});
  var rl2=document.getElementById('rstlt');
  if(rl2)rl2.addEventListener('click',function(){document.querySelectorAll('[data-pk]').forEach(function(el){el.classList.remove('pcol','pclosed','pmax','pfit','psized');el.style.width='';el.style.height='';var fc=el.querySelector(':scope>.pbar>button:nth-child(1)');if(fc)fc.textContent='＋';var cc=el.querySelector(':scope>.pbar>button:nth-child(3)');if(cc)cc.textContent='▾';var pk=el.getAttribute('data-pk');try{localStorage.removeItem('rep:pk:'+pk)}catch(e){}});});
 })();

 // --- export a standalone .html: 'both' | 'ua' | 'en' ---------------------
 // Single-language exports strip the other language's nodes AND the surviving
 // data-* attributes, or a stale localStorage value would render it blank.
 // The whole download group is removed (an export can't re-export itself);
 // the ☰ burger with language + theme survives so the file stays switchable.
 function exportDoc(mode){
  var root=document.documentElement.cloneNode(true), i, n, kill;
  n=root.querySelector('#dlgrp'); if(n)n.parentNode.removeChild(n);
  if(mode!=='both'){
   kill=root.querySelectorAll(mode==='ua'?'[data-en]':'[data-ua]');
   for(i=kill.length-1;i>=0;i--)kill[i].parentNode.removeChild(kill[i]);
   var keep=root.querySelectorAll('[data-en],[data-ua]');
   for(i=0;i<keep.length;i++){keep[i].removeAttribute('data-en');keep[i].removeAttribute('data-ua');}
   n=root.querySelector('#lang'); if(n){var g=n.closest('.grp'); (g||n).parentNode.removeChild(g||n);}
   root.classList.remove('ua');
   root.setAttribute('lang',mode==='ua'?'uk':'en');
  }
  var base=(location.pathname.split('/').pop()||'report.html').replace(/\.html?$/,'')||'report';
  var blob=new Blob(['<!DOCTYPE html>\n'+root.outerHTML],{type:'text/html;charset=utf-8'});
  var url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=base+(mode==='both'?'':'-'+mode)+'.html';
  document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(url);if(a.parentNode)a.parentNode.removeChild(a);},0);
  if(C)C.open=false;
 }
 if(DL){
  var db=DL.querySelectorAll('[data-dl]');
  for(var m=0;m<db.length;m++)(function(b){b.onclick=function(){exportDoc(b.getAttribute('data-dl'))};})(db[m]);
 }
 if(C)document.addEventListener('click',function(e){if(C.open&&!C.contains(e.target))C.open=false;});
})();
</script>
</body>
